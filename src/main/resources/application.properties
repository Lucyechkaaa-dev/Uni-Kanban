# Settings come from the project-root .env (see .env.example); an environment variable overrides these defaults.
# Database (DB_URL, DB_USER, DB_PASS, DB_SCHEMA) is read by hibernate.cfg.xml.
server.port=${BACKEND_PORT:8081}
# The login cookie is HttpOnly and SameSite=Lax. Set APP_COOKIE_SECURE=true when the site is served over HTTPS.
app.cookie.secure=${APP_COOKIE_SECURE:false}
